<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Importer settings</title>
<style>
  :root { color-scheme: light dark; }
  body { font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; max-width:520px; margin:40px auto; padding:0 20px; }
  label { display:block; margin-top:16px; font-size:13px; font-weight:600; }
  input { width:100%; box-sizing:border-box; height:42px; margin-top:6px; padding:0 12px; border-radius:12px; border:1px solid rgba(127,127,127,.3); font:inherit; background:transparent; color:inherit; }
  button { margin-top:20px; height:42px; padding:0 22px; border:0; border-radius:999px; background:#0071e3; color:#fff; font:600 15px inherit; cursor:pointer; }
  p { color:#6e6e73; font-size:13px; }
</style>
</head>
<body>
  <h1>Importer settings</h1>
  <p>Create an import key in your store: Admin, Import products, Chrome extension, New import key.</p>
  <label for="storeUrl">Store URL</label>
  <input id="storeUrl" placeholder="https://your-store.com or http://localhost:3000">
  <label for="token">Import key</label>
  <input id="token" type="password" placeholder="imp_...">
  <button id="save">Save</button>
  <p id="status"></p>
  <script src="options.js"></script>
</body>
</html>
