<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --bg:#f5f5f7; --card:#fff; --fg:#1d1d1f; --muted:#6e6e73; --accent:#0071e3; --line:rgba(0,0,0,.08); }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --fg:#f5f5f7; --muted:#a1a1a6; --accent:#2997ff; --line:rgba(255,255,255,.1); } }
  body { margin:0; width:360px; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { padding:16px; }
  h1 { font-size:17px; margin:0 0 12px; letter-spacing:-.01em; }
  .card { background:var(--card); border-radius:16px; padding:12px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .row { display:flex; gap:10px; align-items:center; }
  .thumb { width:64px; height:64px; border-radius:12px; object-fit:cover; background:var(--line); flex-shrink:0; }
  .title { font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .muted { color:var(--muted); font-size:12px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; text-align:center; }
  .stat { background:var(--bg); border-radius:10px; padding:6px 0; }
  .stat b { display:block; font-size:15px; }
  button { width:100%; margin-top:12px; height:40px; border:0; border-radius:999px; background:var(--accent); color:#fff; font:600 14px inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .msg { margin-top:10px; font-size:13px; }
  .err { color:#ff453a; } .ok { color:#30d158; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Import to my store</h1>
  <div id="content" class="card muted">Reading this page…</div>
  <div id="priceRow" style="display:none;margin-top:10px"><label class="muted" for="manualPrice">Price on the page</label><input id="manualPrice" type="number" min="0" step="0.01" placeholder="e.g. 11.49" style="width:100%;box-sizing:border-box;height:38px;margin-top:4px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit"></div>
  <button id="send" disabled>Send to store</button>
  <div id="msg" class="msg"></div>
  <p class="muted" style="margin-top:12px"><a href="#" id="opts">Settings</a> · <a href="#" id="copyDebug">Copy debug info</a></p>
</div>
<script src="popup.js"></script>
</body>
</html>
